<script>window.APP_DATA = {"sessions": [{"no": 1, "trayecto": 1, "week": 1, "title": "Investigar comienza con preguntar", "purpose": "Distinguir curiosidad cotidiana de pregunta investigable.", "concept": "La investigación social comienza cuando una inquietud deja de ser solamente curiosidad y se convierte en una pregunta que puede ser examinada de manera sistemática. Preguntar investigativamente implica precisar qué queremos comprender, sobre quiénes, en qué contexto y con qué tipo de información podríamos aproximarnos a una respuesta.", "example": "Una estudiante observa que algunos compañeros abandonan clases antes de terminar la jornada. La curiosidad sería preguntarse simplemente por qué se van; una pregunta investigable sería indagar qué factores académicos, familiares, económicos o de transporte influyen en esa salida anticipada.", "select_q": "Describe una situación cotidiana que despierte tu curiosidad e identifica qué aspecto concreto te llama la atención.", "process_q": "Convierte esa curiosidad en dos preguntas distintas y compara cuál de ellas es más clara y delimitada.", "transfer_q": "Formula una pregunta investigable aplicable a otra situación de tu barrio, universidad o comunidad.", "product": "Ficha de formulación de pregunta inicial"}, {"no": 2, "trayecto": 1, "week": 1, "title": "La realidad social como objeto de conocimiento", "purpose": "Reconocer que la realidad social puede observarse, describirse e interpretarse.", "concept": "La realidad social está compuesta por acciones, relaciones, normas, instituciones, significados y conflictos. No es un escenario fijo, sino una construcción dinámica. Para investigarla necesitamos diferenciar lo que observamos directamente de las interpretaciones que hacemos sobre ello.", "example": "En una fila para realizar un trámite universitario podemos observar tiempos de espera, interacciones y reglas; interpretar exige preguntarnos por qué se producen demoras, qué significan para los usuarios y cómo se organiza institucionalmente el servicio.", "select_q": "Elige una escena social cotidiana y registra cinco elementos observables sin explicarlos.", "process_q": "Separa en dos columnas lo observado y lo interpretado. Explica la diferencia.", "transfer_q": "Aplica esta distinción a otra situación institucional o comunitaria.", "product": "Registro de observación e interpretación"}, {"no": 3, "trayecto": 1, "week": 2, "title": "Observación de situaciones cotidianas", "purpose": "Identificar hechos, actores y relaciones en una situación próxima.", "concept": "Observar investigativamente no es mirar de manera casual. Supone dirigir la atención con intención, registrar de forma ordenada y reconocer actores, acciones, relaciones, espacios y tiempos. La observación permite descubrir regularidades y preguntas que pueden pasar inadvertidas en la vida cotidiana.", "example": "En un mercado barrial, observar no consiste solo en ver personas comprando. Puede implicar registrar quién negocia precios, cómo se distribuyen puestos, qué productos se venden más y qué interacciones se repiten.", "select_q": "Selecciona una situación cotidiana e identifica actores, acciones, espacio y tiempo.", "process_q": "Organiza la información en una matriz simple de cuatro categorías.", "transfer_q": "Explica qué nueva pregunta surge después de ordenar la observación.", "product": "Matriz de observación cotidiana"}, {"no": 4, "trayecto": 1, "week": 2, "title": "De la descripción a la problematización", "purpose": "Pasar de narrar lo que ocurre a preguntar por qué ocurre.", "concept": "Describir permite establecer qué sucede; problematizar implica identificar tensiones, contradicciones, desigualdades, vacíos o relaciones que requieren explicación. Una situación se vuelve problemática para la investigación cuando formulamos preguntas que superan la mera narración.", "example": "Decir que hay retrasos frecuentes en el transporte describe un hecho. Preguntar cómo esos retrasos afectan la asistencia de estudiantes y qué factores del sistema de transporte los producen inicia una problematización.", "select_q": "Describe brevemente una situación sin explicar sus causas.", "process_q": "Identifica al menos dos tensiones o aspectos problemáticos presentes.", "transfer_q": "Transforma la descripción en una formulación inicial del problema.", "product": "Ficha de problematización inicial"}, {"no": 5, "trayecto": 1, "week": 3, "title": "Información, dato y evidencia", "purpose": "Diferenciar información disponible, dato pertinente y evidencia para investigar.", "concept": "La información es amplia y puede provenir de múltiples fuentes. Un dato es una unidad seleccionada porque resulta pertinente para una pregunta. La evidencia aparece cuando esos datos, adecuadamente obtenidos y contextualizados, permiten sostener una afirmación o interpretación.", "example": "Saber que muchos estudiantes usan transporte público es información. Registrar cuántos tardan más de una hora en llegar es un dato. Relacionar sistemáticamente esos tiempos con retrasos de asistencia puede constituir evidencia sobre un problema.", "select_q": "Reúne cinco informaciones posibles sobre una situación social.", "process_q": "Decide cuáles podrían convertirse en datos útiles y justifica por qué.", "transfer_q": "Explica qué datos necesitarías para sostener una afirmación sobre otra situación.", "product": "Tabla información-dato-evidencia"}, {"no": 6, "trayecto": 1, "week": 3, "title": "Fuentes de información social", "purpose": "Reconocer fuentes primarias, secundarias y cotidianas.", "concept": "Las fuentes primarias permiten acceder de manera directa a actores o registros originales; las secundarias reorganizan o analizan información ya producida; las fuentes cotidianas aportan indicios y experiencias, aunque requieren ser verificadas antes de usarlas como sustento.", "example": "Para estudiar violencia escolar, una entrevista a estudiantes sería fuente primaria; un informe institucional ya publicado, secundaria; un comentario difundido en redes sociales puede orientar la búsqueda, pero no debe asumirse automáticamente como evidencia.", "select_q": "Enumera posibles fuentes para estudiar una situación elegida.", "process_q": "Clasifícalas como primarias, secundarias o cotidianas.", "transfer_q": "Selecciona las dos más pertinentes y explica cómo las utilizarías.", "product": "Mapa de fuentes"}, {"no": 7, "trayecto": 1, "week": 4, "title": "La mirada investigativa", "purpose": "Construir una actitud de observación reflexiva y sistemática.", "concept": "La mirada investigativa combina curiosidad, disciplina, capacidad de extrañamiento y disposición a revisar nuestras propias ideas. Investigar requiere evitar conclusiones apresuradas y aceptar que la primera explicación puede ser incompleta o sesgada.", "example": "Si en una oficina pocas personas usan un servicio digital, podríamos pensar que es por falta de interés. Una mirada investigativa preguntaría también por acceso, habilidades digitales, confianza, horarios o problemas de diseño.", "select_q": "Identifica una explicación rápida que suelas dar sobre un hecho social.", "process_q": "Propón al menos tres explicaciones alternativas.", "transfer_q": "Explica qué información necesitarías para decidir entre esas alternativas.", "product": "Ficha de revisión de supuestos"}, {"no": 8, "trayecto": 1, "week": 4, "title": "Primer registro de una situación social", "purpose": "Elaborar una ficha inicial de observación y preguntas.", "concept": "Registrar significa transformar una experiencia en información recuperable. Una ficha de registro ordena fecha, lugar, actores, hechos observados, preguntas emergentes y primeras interpretaciones. Esto permite comparar observaciones y construir continuidad en el proceso investigativo.", "example": "Tras observar una reunión vecinal, una ficha puede registrar quiénes participaron, qué temas generaron discusión, qué decisiones se tomaron y qué preguntas quedaron abiertas.", "select_q": "Realiza un registro breve de una situación observada.", "process_q": "Ordena lo observado en hechos, actores, relaciones y preguntas.", "transfer_q": "Formula una pregunta que pueda orientar una observación futura.", "product": "Ficha de registro social"}, {"no": 9, "trayecto": 2, "week": 5, "title": "Racionalidad e interpretación de la realidad social", "purpose": "Reconocer que una situación puede ser interpretada desde diferentes racionalidades.", "concept": "La racionalidad puede entenderse como la lógica desde la cual una persona o grupo organiza razones, valores, experiencias e intereses para comprender una situación y decidir cómo actuar. En investigación social es importante reconstruir esas razones sin asumir que existe una única interpretación posible.", "example": "Ante el cierre nocturno de una cancha, algunos vecinos priorizan descanso y seguridad, mientras jóvenes valoran encuentro y uso del espacio público. El hecho es el mismo, pero las racionalidades desde las que se interpreta son distintas.", "select_q": "Identifica hechos, actores e intereses presentes en la situación.", "process_q": "Compara las razones de al menos dos actores y señala en qué difieren.", "transfer_q": "Explica otra situación cotidiana utilizando el concepto de racionalidad.", "product": "Ficha de análisis de racionalidades"}, {"no": 10, "trayecto": 2, "week": 5, "title": "Actores sociales e intereses", "purpose": "Identificar posiciones, intereses y capacidades de acción.", "concept": "Los actores sociales son individuos, grupos u organizaciones que intervienen en una situación y tienen capacidad de incidir en ella. Sus intereses no siempre son visibles y pueden coincidir, competir o entrar en conflicto.", "example": "En la recuperación de una plaza pueden intervenir vecinos, comerciantes, municipio, jóvenes y transportistas. Cada actor puede tener expectativas distintas sobre el uso del espacio.", "select_q": "Identifica los principales actores de una situación social.", "process_q": "Relaciona a cada actor con sus intereses, recursos y posición.", "transfer_q": "Explica qué conflicto o alianza podría surgir entre ellos.", "product": "Mapa de actores e intereses"}, {"no": 11, "trayecto": 2, "week": 6, "title": "Relaciones sociales y contexto", "purpose": "Comprender que los hechos adquieren sentido dentro de relaciones y contextos.", "concept": "Los hechos sociales no ocurren aisladamente. Su significado depende de relaciones familiares, económicas, culturales, institucionales y políticas, así como del momento histórico y del territorio donde ocurren.", "example": "La deserción escolar no puede comprenderse solo observando al estudiante. Puede relacionarse con trabajo familiar, distancia, condiciones económicas, expectativas culturales y funcionamiento institucional.", "select_q": "Describe un hecho social e identifica su contexto inmediato.", "process_q": "Construye una red de relaciones que ayuden a comprenderlo.", "transfer_q": "Explica cómo cambiaría tu interpretación si el contexto fuera diferente.", "product": "Red de relaciones y contexto"}, {"no": 12, "trayecto": 2, "week": 6, "title": "Estructura, situación y acontecimiento", "purpose": "Distinguir niveles de análisis de una realidad social.", "concept": "Una estructura refiere a relaciones relativamente estables; una situación corresponde a una configuración concreta de actores y condiciones; un acontecimiento es un hecho específico que ocurre en un momento determinado. Distinguirlos ayuda a no confundir causas profundas con episodios puntuales.", "example": "El desempleo juvenil puede relacionarse con una estructura económica; una feria laboral concreta constituye una situación; el cierre repentino de una empresa es un acontecimiento.", "select_q": "Elige un problema y ubica un elemento estructural, una situación y un acontecimiento.", "process_q": "Explica cómo se relacionan esos tres niveles.", "transfer_q": "Aplica la misma distinción a otro problema social.", "product": "Matriz de niveles de análisis"}, {"no": 13, "trayecto": 2, "week": 7, "title": "Categorías para ordenar la realidad", "purpose": "Construir categorías simples a partir de información observada.", "concept": "Las categorías son herramientas conceptuales que permiten agrupar hechos o datos con características comunes. No deben imponerse de manera arbitraria: se construyen o seleccionan según la pregunta y la información disponible.", "example": "En entrevistas sobre uso de transporte pueden aparecer categorías como tiempo de viaje, costo, seguridad y frecuencia.", "select_q": "Reúne diez datos breves sobre una situación.", "process_q": "Agrúpalos en tres o cuatro categorías y coloca un nombre a cada grupo.", "transfer_q": "Explica qué categoría resulta más importante para comprender el problema y por qué.", "product": "Matriz de categorización"}, {"no": 14, "trayecto": 2, "week": 7, "title": "Comparar interpretaciones", "purpose": "Contrastar explicaciones y reconocer supuestos.", "concept": "Comparar interpretaciones permite reconocer coincidencias, diferencias y supuestos detrás de distintas explicaciones. La comparación obliga a preguntar qué evidencia sostiene cada interpretación y qué aspectos deja fuera.", "example": "Un bajo rendimiento académico puede atribuirse a falta de estudio, condiciones de trabajo, dificultades pedagógicas o problemas familiares. Cada explicación ilumina algunos elementos y puede ocultar otros.", "select_q": "Selecciona dos explicaciones distintas sobre un mismo hecho.", "process_q": "Compara qué supuestos, datos y consecuencias tiene cada una.", "transfer_q": "Formula una interpretación más amplia que incorpore elementos de ambas.", "product": "Cuadro comparativo de interpretaciones"}, {"no": 15, "trayecto": 2, "week": 8, "title": "Del sentido común al conocimiento sistemático", "purpose": "Reconocer límites y aportes del conocimiento cotidiano.", "concept": "El sentido común organiza experiencias acumuladas y permite actuar rápidamente, pero puede contener generalizaciones, estereotipos o explicaciones no verificadas. La investigación no elimina el conocimiento cotidiano; lo somete a contraste y análisis sistemático.", "example": "Decir que 'los jóvenes ya no leen' es una generalización. Investigar requeriría definir qué entendemos por lectura, qué formatos consideramos y qué datos permitirían sostener o cuestionar esa afirmación.", "select_q": "Escribe una afirmación de sentido común sobre un tema social.", "process_q": "Identifica qué datos necesitarías para verificarla.", "transfer_q": "Reformula la afirmación como una pregunta de investigación.", "product": "Ficha de contraste del sentido común"}, {"no": 16, "trayecto": 2, "week": 8, "title": "Lectura integrada de una situación social", "purpose": "Elaborar una primera interpretación argumentada.", "concept": "Una interpretación argumentada articula hechos, actores, relaciones, contexto, categorías y evidencia. No basta con opinar; es necesario mostrar cómo se llega a una conclusión y qué información la sostiene.", "example": "Para explicar conflictos por el uso de un espacio público, una interpretación integrada puede relacionar normas municipales, necesidades vecinales, prácticas juveniles y cambios recientes en el barrio.", "select_q": "Resume los principales datos de una situación estudiada.", "process_q": "Organízalos en actores, relaciones, contexto y categorías.", "transfer_q": "Redacta una interpretación de un párrafo sustentada en esa información.", "product": "Primera interpretación argumentada"}, {"no": 17, "trayecto": 3, "week": 9, "title": "Problematizar una situación social", "purpose": "Transformar una preocupación amplia en un problema susceptible de investigación.", "concept": "Problematizar supone convertir una preocupación general en un conjunto de relaciones, tensiones y preguntas específicas. Un problema de investigación debe ser comprensible, delimitable y susceptible de ser estudiado con información accesible.", "example": "La preocupación 'hay mucha violencia' es demasiado amplia. Puede problematizarse estudiando cómo se expresan determinadas formas de violencia entre estudiantes de un curso y qué factores contextuales se relacionan con ellas.", "select_q": "Escribe una preocupación social amplia.", "process_q": "Identifica dimensiones, actores, espacio y posibles relaciones.", "transfer_q": "Redacta una primera formulación del problema.", "product": "Borrador del problema de investigación"}, {"no": 18, "trayecto": 3, "week": 9, "title": "Delimitación del problema", "purpose": "Delimitar espacio, tiempo, población y dimensión analítica.", "concept": "Delimitar significa decidir qué parte de una realidad será estudiada. La delimitación evita problemas imposibles de abarcar y ayuda a definir población, lugar, periodo y aspecto principal de interés.", "example": "En lugar de estudiar 'desempleo juvenil en Bolivia', puede estudiarse la experiencia de búsqueda de empleo de egresados recientes de una determinada carrera en Cochabamba durante un periodo específico.", "select_q": "Toma tu problema inicial e identifica población, espacio, tiempo y dimensión.", "process_q": "Evalúa qué elementos siguen siendo demasiado amplios.", "transfer_q": "Redacta una versión delimitada del problema.", "product": "Ficha de delimitación"}, {"no": 19, "trayecto": 3, "week": 10, "title": "Formulación de la pregunta de investigación", "purpose": "Construir una pregunta clara, pertinente y viable.", "concept": "La pregunta de investigación orienta todo el proceso. Debe ser clara, abierta a indagación, coherente con el problema y viable según los recursos y el tiempo disponibles. Una buena pregunta no contiene de antemano la respuesta.", "example": "En lugar de preguntar '¿por qué los estudiantes son irresponsables?', sería más investigable preguntar '¿qué factores influyen en el incumplimiento de actividades académicas en estudiantes de primer semestre?'", "select_q": "Escribe tres posibles preguntas para tu problema.", "process_q": "Evalúalas según claridad, pertinencia y viabilidad.", "transfer_q": "Selecciona y mejora una pregunta principal.", "product": "Pregunta de investigación"}, {"no": 20, "trayecto": 3, "week": 10, "title": "Coherencia entre problema y pregunta", "purpose": "Revisar correspondencia entre situación problemática y pregunta.", "concept": "Problema y pregunta deben referirse al mismo núcleo. Si el problema describe una relación o fenómeno pero la pregunta indaga otro, la investigación pierde coherencia. Revisar esa correspondencia evita desviaciones posteriores.", "example": "Si el problema se concentra en barreras de acceso a servicios de salud, una pregunta sobre satisfacción general de usuarios puede ser insuficiente si no aborda dichas barreras.", "select_q": "Coloca lado a lado tu problema y tu pregunta.", "process_q": "Subraya palabras o ideas que coinciden y marca las que no.", "transfer_q": "Ajusta ambos textos para mejorar su correspondencia.", "product": "Matriz de coherencia problema-pregunta"}, {"no": 21, "trayecto": 3, "week": 11, "title": "Objetivo general", "purpose": "Formular el propósito central de la investigación.", "concept": "El objetivo general expresa qué pretende lograr la investigación en términos de conocimiento. Debe guardar relación directa con la pregunta y utilizar un verbo adecuado como analizar, comprender, describir, identificar o explicar.", "example": "Si la pregunta busca conocer factores que influyen en abandono académico, el objetivo puede formularse como 'Analizar los factores asociados al abandono académico...'.", "select_q": "Identifica el verbo central implícito en tu pregunta.", "process_q": "Formula dos versiones de objetivo general.", "transfer_q": "Selecciona la más coherente y justifica tu elección.", "product": "Objetivo general"}, {"no": 22, "trayecto": 3, "week": 11, "title": "Objetivos específicos", "purpose": "Desagregar el objetivo general en acciones coherentes.", "concept": "Los objetivos específicos descomponen el propósito general en operaciones de conocimiento necesarias para alcanzarlo. No son tareas administrativas; deben expresar resultados cognoscitivos parciales y mantener una secuencia lógica.", "example": "Para analizar factores de abandono pueden plantearse objetivos específicos de describir trayectorias, identificar factores familiares y académicos, y comparar experiencias entre grupos.", "select_q": "Divide tu objetivo general en tres componentes.", "process_q": "Transforma cada componente en un objetivo específico.", "transfer_q": "Revisa si juntos permiten alcanzar el objetivo general.", "product": "Matriz de objetivos"}, {"no": 23, "trayecto": 3, "week": 12, "title": "Antecedentes del problema", "purpose": "Identificar estudios y experiencias previas pertinentes.", "concept": "Los antecedentes muestran qué se ha investigado previamente, qué resultados existen y qué aspectos permanecen poco explorados. No consisten en acumular citas, sino en seleccionar trabajos relevantes para comprender el problema.", "example": "Para estudiar abandono universitario, pueden revisarse tesis, artículos, informes institucionales y estudios regionales que permitan identificar enfoques y hallazgos previos.", "select_q": "Localiza o imagina tres tipos de antecedentes pertinentes para tu tema.", "process_q": "Explica qué podría aportar cada uno.", "transfer_q": "Define qué vacío o aspecto todavía necesitaría ser investigado.", "product": "Ficha de antecedentes"}, {"no": 24, "trayecto": 3, "week": 12, "title": "Construcción de un primer estado de conocimiento", "purpose": "Organizar antecedentes por aportes, coincidencias y vacíos.", "concept": "El estado de conocimiento organiza antecedentes para mostrar tendencias, coincidencias, diferencias y vacíos. Su valor reside en la síntesis comparativa, no en la simple enumeración de autores o trabajos.", "example": "Varios estudios pueden coincidir en factores económicos, mientras otros destacan variables académicas. Compararlos permite reconocer qué dimensiones están mejor estudiadas y cuáles requieren mayor atención.", "select_q": "Resume tres antecedentes en pocas líneas.", "process_q": "Compáralos según tema, método y principales hallazgos.", "transfer_q": "Redacta una síntesis que muestre coincidencias y un vacío.", "product": "Primer estado de conocimiento"}, {"no": 25, "trayecto": 4, "week": 13, "title": "Decisiones metodológicas iniciales", "purpose": "Relacionar pregunta y objetivos con una estrategia de indagación.", "concept": "La metodología organiza las decisiones sobre cómo producir información para responder la pregunta. No se elige por costumbre, sino por coherencia con el problema, los objetivos, el tipo de información requerida y las condiciones reales del estudio.", "example": "Si queremos comprender experiencias personales, entrevistas pueden ser más adecuadas que una encuesta cerrada. Si queremos estimar frecuencia de un fenómeno en una población amplia, una encuesta puede resultar pertinente.", "select_q": "Identifica qué tipo de información necesita tu pregunta.", "process_q": "Propón dos estrategias posibles para producirla.", "transfer_q": "Selecciona una estrategia inicial y justifica su coherencia.", "product": "Decisión metodológica inicial"}, {"no": 26, "trayecto": 4, "week": 13, "title": "Enfoques y formas de aproximación", "purpose": "Reconocer diferencias básicas entre aproximaciones cuantitativas, cualitativas y combinadas.", "concept": "Una aproximación cuantitativa privilegia medición y comparación de variables; una cualitativa busca comprender significados, experiencias y procesos; una combinada articula ambas cuando la pregunta lo requiere. Ninguna es superior por sí misma: su pertinencia depende del problema.", "example": "Para estudiar uso de redes sociales, una encuesta puede estimar frecuencia de uso y entrevistas pueden explorar significados y experiencias.", "select_q": "Describe qué datos cuantitativos y cualitativos podrían ser útiles en tu tema.", "process_q": "Compara ventajas y límites de cada aproximación.", "transfer_q": "Decide cuál usarías y por qué.", "product": "Ficha de enfoque metodológico"}, {"no": 27, "trayecto": 4, "week": 14, "title": "Técnicas de producción de información", "purpose": "Seleccionar técnicas coherentes con la pregunta de investigación.", "concept": "Las técnicas son procedimientos para producir o recoger información: entrevista, encuesta, observación, grupo focal, revisión documental, entre otras. Su selección debe responder a qué queremos conocer y de quién o de dónde obtendremos la información.", "example": "Para conocer normas institucionales conviene revisar documentos; para comprender experiencias de usuarios puede ser útil entrevistar; para registrar prácticas en un espacio, observar.", "select_q": "Enumera tres técnicas posibles para tu investigación.", "process_q": "Relaciona cada técnica con el tipo de información que produciría.", "transfer_q": "Selecciona una o dos técnicas y justifica su elección.", "product": "Matriz técnica-información"}, {"no": 28, "trayecto": 4, "week": 14, "title": "Instrumentos de registro", "purpose": "Diseñar preguntas, guías o matrices iniciales.", "concept": "Un instrumento concreta una técnica. Una guía de entrevista organiza preguntas; un cuestionario operacionaliza variables; una matriz de observación ordena categorías. Un buen instrumento debe ser comprensible, pertinente y coherente con los objetivos.", "example": "Si el objetivo es conocer dificultades en acceso a un servicio, la guía debe incluir preguntas sobre proceso de atención, tiempos, barreras y experiencias, no temas ajenos.", "select_q": "Selecciona una técnica y define qué información necesitas obtener.", "process_q": "Diseña cinco preguntas o criterios de registro.", "transfer_q": "Revisa si cada ítem se relaciona con algún objetivo.", "product": "Borrador de instrumento"}, {"no": 29, "trayecto": 4, "week": 15, "title": "Ética en investigación social", "purpose": "Reconocer consentimiento, confidencialidad, respeto y responsabilidad.", "concept": "La ética atraviesa todo el proceso investigativo. Implica informar adecuadamente, respetar decisiones, proteger identidad cuando corresponde, evitar daño y utilizar la información de manera responsable. No es un trámite final, sino un criterio permanente.", "example": "Entrevistar a una persona sobre experiencias sensibles exige explicar el propósito, permitir que se retire y proteger información que pueda identificarla.", "select_q": "Identifica posibles riesgos éticos en tu proyecto.", "process_q": "Propón medidas de consentimiento, confidencialidad y cuidado.", "transfer_q": "Redacta tres compromisos éticos para tu investigación.", "product": "Protocolo ético básico"}, {"no": 30, "trayecto": 4, "week": 15, "title": "Trabajo de campo inicial", "purpose": "Preparar y simular una primera aproximación al campo.", "concept": "El trabajo de campo pone en contacto el diseño con la realidad. Requiere preparación, flexibilidad, registro y capacidad de adaptación. La primera aproximación permite detectar dificultades que no siempre aparecen en el diseño escrito.", "example": "Una entrevista piloto puede revelar preguntas poco claras, tiempos excesivos o temas imprevistos que obligan a ajustar el instrumento.", "select_q": "Planifica una actividad de campo breve.", "process_q": "Anticipa tres dificultades posibles y cómo responderías.", "transfer_q": "Realiza una simulación y registra qué mejorarías.", "product": "Plan de campo y registro piloto"}, {"no": 31, "trayecto": 4, "week": 16, "title": "Organización inicial de la información", "purpose": "Clasificar y ordenar información producida.", "concept": "La información recogida necesita organizarse antes de analizarse. Esto puede implicar codificar respuestas, agrupar temas, ordenar registros o construir tablas. Una buena organización conserva el vínculo entre cada dato y su contexto.", "example": "Después de varias entrevistas, fragmentos sobre tiempo, costo y trato pueden agruparse en categorías para comenzar a comparar experiencias.", "select_q": "Toma un conjunto breve de datos o respuestas.", "process_q": "Agrúpalos en categorías y explica el criterio utilizado.", "transfer_q": "Formula una conclusión inicial sin exceder lo que los datos permiten afirmar.", "product": "Matriz inicial de organización"}, {"no": 32, "trayecto": 4, "week": 16, "title": "Integración del proyecto formativo", "purpose": "Articular problema, pregunta, objetivos y estrategia metodológica inicial.", "concept": "La calidad de un proyecto depende de la coherencia entre sus partes. El problema debe conducir a una pregunta; la pregunta a objetivos; y estos a decisiones metodológicas capaces de producir información pertinente. Integrar significa revisar esas relaciones como un sistema.", "example": "Si la pregunta busca comprender experiencias, los objetivos y técnicas deben permitir acceder a esas experiencias; una metodología centrada solo en conteos podría resultar insuficiente.", "select_q": "Reúne problema, pregunta, objetivos y metodología en una sola matriz.", "process_q": "Identifica coherencias y posibles contradicciones entre las partes.", "transfer_q": "Redacta una versión integrada y corregida del proyecto inicial.", "product": "Proyecto formativo integrado"}], "evaluations": [{"week": 17, "title": "Evaluación integradora I", "desc": "Síntesis y aplicación de aprendizajes de los Trayectos I y II."}, {"week": 18, "title": "Evaluación integradora II", "desc": "Revisión de coherencia entre problema, pregunta y objetivos."}, {"week": 19, "title": "Evaluación del proyecto formativo", "desc": "Presentación, argumentación y retroalimentación del proyecto inicial."}, {"week": 20, "title": "Segunda instancia y cierre", "desc": "Regularización, recuperación y cierre reflexivo del portafolio."}]};</script>
